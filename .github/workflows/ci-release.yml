name: Plugin CI and Release

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check plugin version bump
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          FILE="advanced-divi-forms.php"

          OLD_VERSION=$(git show origin/main:"$FILE" |
            sed -nE 's/^[[:space:]]*\* Version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' |
            head -1)

          NEW_VERSION=$(sed -nE \
            's/^[[:space:]]*\* Version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' \
            "$FILE" | head -1)

          echo "Current version: $OLD_VERSION"
          echo "PR version:      $NEW_VERSION"

          if [[ -z "$OLD_VERSION" || -z "$NEW_VERSION" ]]; then
            echo "::error::Could not read plugin version"
            exit 1
          fi

          if [[ "$OLD_VERSION" == "$NEW_VERSION" ]]; then
            echo "::error::Plugin version must be increased"
            exit 1
          fi

          if [[ "$(printf '%s\n' "$OLD_VERSION" "$NEW_VERSION" |
            sort -V | tail -1)" != "$NEW_VERSION" ]]; then
            echo "::error::New version must be higher"
            exit 1
          fi

          echo "Plugin version increased successfully"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Check plugin header and PHP syntax
        run: |
          set -euo pipefail
          test -f advanced-divi-forms.php
          grep -q 'Plugin Name: Advanced Divi Forms' advanced-divi-forms.php
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l
      - name: Confirm release tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -Eq "^[[:space:]]*\*[[:space:]]*Version: ${version//./\.}[[:space:]]*$" advanced-divi-forms.php

  release:
    name: Publish release ZIP
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tag to be reachable from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"

          PLUGIN_VERSION=$(sed -nE \
            's/^[[:space:]]*\* Version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' \
            advanced-divi-forms.php | head -1)

          if [[ "$TAG_VERSION" != "$PLUGIN_VERSION" ]]; then
            echo "::error::Tag and plugin version differ"
            exit 1
          fi
      
      - name: Build plugin ZIP
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_DIR="dist/staging/advanced-divi-forms"

          mkdir -p "$PLUGIN_DIR"

          cp advanced-divi-forms.php "$PLUGIN_DIR/"

          # Copy optional directories if present.
          for dir in includes templates assets; do
            if [ -d "$dir" ]; then
              cp -r "$dir" "$PLUGIN_DIR/"
            fi
          done

          # Create release ZIP.
          (
            cd dist/staging
            zip -qr ../advanced-divi-forms.zip advanced-divi-forms
          )

          # Verify ZIP integrity.
          unzip -t dist/advanced-divi-forms.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/advanced-divi-forms.zip --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

name: Plugin CI and Release

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          tools: composer:v2, wp-cli
          coverage: none

      - name: Install Composer dependencies
        run: composer --working-dir=.ci install --no-interaction --prefer-dist

      - name: WordPress Coding Standards
        run: .ci/vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: Check plugin structure
        run: |
          set -euo pipefail
          test -f advanced-divi-forms.php
          grep -q 'Plugin Name: Advanced Divi Forms' \
            advanced-divi-forms.php

      - name: Check PHP syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './.ci/vendor/*' \
            -not -path './dist/*' \
            -not -path './Divi/*' \
            -print0 | xargs -0 -r -n1 php -l

      - name: Test GitHub updater
        run: php tests/github-updater.php

      - name: Test Divi Visual Builder settings
        run: node tests/divi-settings.js

      - name: Validate plugin versions
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            bash scripts/check-version.sh pr
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            bash scripts/check-version.sh release
          else
            bash scripts/check-version.sh
          fi

      - name: Build plugin ZIP
        run: bash scripts/build-plugin.sh

      - name: Test WordPress plugin activation
        env:
          WP_DB_HOST: 127.0.0.1:3306
          WP_DB_NAME: wordpress_test
          WP_DB_USER: wordpress
          WP_DB_PASSWORD: wordpress
        run: bash scripts/test-wordpress-activation.sh dist/advanced-divi-forms.zip

      - name: Upload tested plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: advanced-divi-forms-release
          path: dist/advanced-divi-forms.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release ZIP
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require tag to be reachable from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Download tested plugin ZIP
        uses: actions/download-artifact@v4
        with:
          name: advanced-divi-forms-release
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "$GITHUB_REF_NAME" \
            dist/advanced-divi-forms.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
